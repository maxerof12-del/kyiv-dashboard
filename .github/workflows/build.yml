name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KyivDashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KyivDashboard-apk
          path: KyivDashboard.apk

      - name: Publish as "latest" release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kyiv Dashboard (latest build)
          prerelease: false
          make_latest: true
          files: KyivDashboard.apk
